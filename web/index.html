<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Being</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">Being</div>
  <div class="top-right">
    <div id="conn" data-state="pending" title="冒烟调用成功即在线">
      <span class="conn-dot"></span><span id="conn-text">检测中</span>
    </div>
    <button id="clear" type="button" title="清空这个会话（无法撤销）">清空</button>
  </div>
</header>

<main id="chat-wrap">
  <div id="messages"></div>
  <button id="scroll-bottom" type="button" aria-label="回到底部">回到底部</button>
</main>

<div id="status" aria-live="polite"></div>

<div id="input-area">
  <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"
            autocomplete="off" spellcheck="false"></textarea>
  <button id="send" type="button" disabled>发送</button>
</div>

<script src="app.js"></script>
</body>
</html>
